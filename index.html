<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản trị Cửa hàng - Knotty Admin</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/286/286350.png">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #d4af37;
            --primary-hover: #b5952f;
            --bg-main: #f8f9fa;
            --text-dark: #2d3748;
            --border-color: #e2e8f0;
            --success: #28a745;
            --danger: #dc3545;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            padding: 30px 15px;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        h1 {
            text-align: center;
            color: var(--text-dark);
            margin-bottom: 30px;
            font-weight: 700;
            font-size: 1.8rem;
            position: relative;
            padding-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: var(--primary);
            border-radius: 2px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .tab-btn {
            padding: 12px 22px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #718096;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--primary);
            background: #f7fafc;
        }

        .tab-btn.active {
            color: #fff;
            background: var(--primary);
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.2);
        }

        .action-bar {
            display: none;
            margin-bottom: 20px;
            text-align: right;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            gap: 8px;
        }

        .btn-add {
            background-color: var(--success);
            color: white;
        }

        .btn-add:hover {
            background-color: #218838;
            transform: translateY(-1px);
        }

        .btn-delete {
            background-color: var(--danger);
            color: white;
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .btn-delete:hover {
            background-color: #c82333;
        }

        .btn-cancel {
            background-color: #e2e8f0;
            color: #4a5568;
        }

        .btn-cancel:hover {
            background-color: #cbd5e0;
        }

        .btn-save {
            background-color: var(--primary);
            color: white;
        }

        .btn-save:hover {
            background-color: var(--primary-hover);
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th {
            background-color: #f7fafc;
            color: #4a5568;
            font-weight: 600;
            padding: 14px 16px;
            border-bottom: 2px solid var(--border-color);
            white-space: nowrap;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 20px;
            text-align: center;
        }

        .badge-cart {
            background-color: #e6fffa;
            color: #319795;
        }

        .badge-phone {
            background-color: #fffaf0;
            color: #dd6b20;
        }

        .badge-cat {
            background-color: #ebf8ff;
            color: #2b6cb0;
        }

        .badge-tag {
            background-color: #f7fafc;
            color: #4a5568;
            border: 1px solid #e2e8f0;
        }

        .loading-status {
            text-align: center;
            padding: 50px 0;
            color: #718096;
            font-size: 1rem;
            font-style: italic;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            animation: slideDown 0.25s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal h2 {
            margin-bottom: 20px;
            font-size: 1.35rem;
            color: var(--text-dark);
            position: relative;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #4a5568;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.2s;
            background: #fff;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.12);
        }

        .form-group select:disabled {
            background-color: #f1f5f9;
            cursor: not-allowed;
            color: #94a3b8;
        }

        .form-group textarea {
            resize: vertical;
            line-height: 1.6;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
            border-top: 1px solid var(--border-color);
            padding-top: 18px;
        }

        .prod-img-preview {
            width: 50px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .realtime-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: -20px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            color: #718096;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.5s infinite ease-in-out;
        }

        @keyframes blink {
            0% {
                opacity: 0.4;
                transform: scale(0.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.1);
                box-shadow: 0 0 8px #2ecc71;
            }

            100% {
                opacity: 0.4;
                transform: scale(0.9);
            }
        }

        .status-dot.error {
            background-color: #dc3545;
            animation: none;
            box-shadow: 0 0 8px #dc3545;
        }

        .row-new-highlight {
            background-color: #f0f8ff !important;
            border-left: 4px solid #3498db !important;
            animation: pulse-glow-blue 2s infinite alternate;
        }

        @keyframes pulse-glow-blue {
            0% {
                box-shadow: inset 0 0 5px rgba(52, 152, 219, 0.15);
            }

            100% {
                box-shadow: inset 0 0 15px rgba(52, 152, 219, 0.3);
            }
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            -webkit-text-fill-color: var(--text-dark) !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* --- FLOATING BELL NOTIFICATION SYSTEM --- */
        #floating-bell {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            background: #ffffff;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid #e2e8f0;
            user-select: none;
        }

        #floating-bell:hover {
            transform: scale(1.08);
        }

        #bell-badge {
            position: absolute;
            top: -3px;
            right: -3px;
            background: #ef4444;
            color: white;
            font-size: 11px;
            font-weight: 800;
            min-width: 18px;
            height: 18px;
            padding: 0 4px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid #ffffff;
            box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4);
        }

        .bell-shake-active {
            animation: extreme-shake 0.6s infinite alternate ease-in-out;
            background: #fffbeb !important;
            border-color: #d4af37 !important;
            box-shadow: 0 4px 25px rgba(212, 175, 55, 0.4) !important;
        }

        @keyframes extreme-shake {
            0% {
                transform: rotate(-15deg);
            }

            100% {
                transform: rotate(15deg);
            }
        }

        #notification-panel {
            position: fixed;
            top: 85px;
            right: 20px;
            width: 340px;
            max-height: 420px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: 1px solid #e2e8f0;
            z-index: 9999;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .noti-header {
            padding: 12px 15px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .noti-header h3 {
            font-size: 0.9rem;
            font-weight: 700;
            color: #1a202c;
            margin: 0;
        }

        .noti-body {
            overflow-y: auto;
            flex: 1;
            max-height: 360px;
        }

        .noti-item {
            padding: 12px 15px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .noti-item:hover {
            background: #f8fafc;
        }

        .noti-icon {
            font-size: 1.2rem;
            line-height: 1.2;
        }

        .noti-content {
            flex: 1;
        }

        .noti-title {
            font-weight: 700;
            font-size: 0.85rem;
            color: #2d3748;
            margin-bottom: 2px;
        }

        .noti-desc {
            font-size: 0.8rem;
            color: #4a5568;
            line-height: 1.4;
        }

        .noti-time {
            font-size: 0.72rem;
            color: #a0aec0;
            margin-top: 5px;
            text-align: right;
        }

        .noti-empty {
            padding: 35px 15px;
            text-align: center;
            color: #718096;
            font-size: 0.85rem;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Hệ thống Quản trị Dữ liệu Knotty</h1>
        <div class="realtime-indicator">
            <span id="status-dot" class="status-dot"></span>
            <span id="status-text">Hệ thống trực tuyến</span>
            <button onclick="logoutAdmin()"
                style="margin-left: 15px; background: none; border: none; color: #dc3545; font-size: 0.85rem; cursor: pointer; text-decoration: underline; font-weight: 600;">Đăng
                xuất</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('LienHe', this)">Khách Hàng Liên Hệ</button>
            <button class="tab-btn" onclick="switchTab('DonHang', this)">Đơn Đặt Hàng</button>
            <button class="tab-btn" onclick="switchTab('QuaTangNoiBat', this)">Quà Tặng Nổi Bật</button>
            <button class="tab-btn" onclick="switchTab('DanhSachQuaTang', this)">Danh Sách Quà Tặng</button>
            <button class="tab-btn" onclick="switchTab('VoucherThongBao', this)">Voucher & Thông báo</button>
            <button class="tab-btn" onclick="switchTab('DanhGia', this)">Đánh Giá</button>
        </div>

        <div id="action-bar" class="action-bar">
            <button class="btn btn-add" onclick="openAddModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Thêm sản phẩm mới
            </button>
        </div>

        <div id="content-area">
            <div class="loading-status">Đang kết nối hệ thống bảo mật...</div>
        </div>
    </div>

    <div id="voucherModal" class="modal">
        <div class="modal-content">
            <h2 id="v_modalTitle">Thêm Voucher Mới</h2>
            <form onsubmit="handleVTSubmit(event, 'Voucher')">
                <div class="form-group"><label>Mã Voucher (Viết liền, không dấu):</label><input type="text" id="v_code"
                        required></div>
                <div class="form-group"><label>Tên hiển thị Voucher:</label><input type="text" id="v_name" required>
                </div>
                <div class="form-group"><label>Số lượng:</label><input type="number" id="v_qty" min="0" required></div>
                <div class="form-group">
                    <label>Loại giảm giá:</label>
                    <select id="v_discountType" required>
                        <option value="Phần trăm">Theo phần trăm (%)</option>
                        <option value="Trừ tiền">Trừ tiền trực tiếp (VNĐ)</option>
                    </select>
                </div>
                <div class="form-group"><label>Mức giảm (Số):</label><input type="number" id="v_discountValue" min="0"
                        required>
                </div>

                <div style="border-top: 1px dashed #e2e8f0; margin-top: 20px; padding-top: 15px;">
                    <div class="form-group">
                        <label style="color: #d4af37;">🎯 Phạm vi áp dụng Voucher:</label>
                        <select id="v_conditionMain" onchange="updateVoucherCondition()" required>
                            <option value="all">Áp dụng cho Tất cả mặt hàng</option>
                            <option value="canhan">Áp dụng cho nhóm Cá nhân</option>
                            <option value="theomua">Áp dụng cho Quà theo mùa</option>
                            <option value="thietke">Áp dụng cho Đặt thiết kế</option>
                            <option value="khac">Áp dụng cho mục Khác</option>
                        </select>
                    </div>
                    <div class="form-group" id="v_conditionSubGroup" style="display: none;">
                        <label>Chỉ định danh mục cụ thể:</label>
                        <select id="v_conditionSub">
                            <option value="all">Toàn bộ danh mục này</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label style="color: #e74c3c;">👁️ Trạng thái hiển thị:</label>
                    <select id="v_visibility" required>
                        <option value="Hiện">Công khai (Hiện trên web cho mọi người)</option>
                        <option value="Ẩn">Ẩn (Chỉ dành cho khách có mã nhập tay)</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeModal('voucherModal')">Hủy bỏ</button>
                    <button type="submit" class="btn btn-save">Lưu Voucher</button>
                </div>
            </form>
        </div>
    </div>

    <div id="notiModal" class="modal">
        <div class="modal-content">
            <h2 id="n_modalTitle">Thêm Thông Báo</h2>
            <form onsubmit="handleVTSubmit(event, 'Thông báo')">
                <div class="form-group">
                    <label>Nội dung thông báo (Sẽ chạy chữ trên trang):</label>
                    <textarea id="n_content" rows="4" required
                        placeholder="Nhập nội dung thông báo tại đây..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeModal('notiModal')">Hủy bỏ</button>
                    <button type="submit" class="btn btn-save">Lưu Thông báo</button>
                </div>
            </form>
        </div>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Thêm Sản Phẩm Mới</h2>
            <form id="productForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label>Tên sản phẩm hiển thị:</label>
                    <input type="text" id="p_title" placeholder="Ví dụ: Hộp Quà Tết An Khang" required>
                </div>
                <div class="form-group">
                    <label>Đường dẫn hình ảnh sản phẩm (Link URL):</label>
                    <input type="url" id="p_img" placeholder="Dán link liên kết hình ảnh vào đây" required>
                </div>
                <div class="form-group">
                    <label>Giá chữ hiển thị (PriceText):</label>
                    <input type="text" id="p_priceText" placeholder="Ví dụ: 350.000 VNĐ hoặc Liên hệ tư vấn" required>
                </div>
                <div class="form-group">
                    <label>Giá số thực tế phục vụ tính tổng tiền (RawPrice):</label>
                    <input type="number" id="p_rawPrice" min="0"
                        placeholder="Ví dụ: 350000 (Gõ số 0 nếu là sản phẩm nhận tư vấn)" required>
                </div>
                <div class="form-group">
                    <label>Nhãn dán góc sản phẩm (Tag - Không bắt buộc):</label>
                    <input type="text" id="p_tag"
                        placeholder="Ví dụ: Bán chạy, Mới về, Giảm 15% (Để trống nếu không dùng)">
                </div>
                <div class="form-group">
                    <label>Chức năng tương tác khi khách bấm nút (Button Action):</label>
                    <select id="p_buttonAction" required>
                        <option value="giohang">Cho phép thêm sản phẩm vào Giỏ Hàng</option>
                        <option value="tuvan">Hiện nút "Nhận Tư Vấn" (Mở biểu mẫu điền thông tin)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Phân loại nhóm chính:</label>
                    <select id="p_type" onchange="updateSubCategories()" required>
                        <option value="">-- Chọn danh mục chính --</option>
                        <option value="canhan">Cá nhân</option>
                        <option value="theomua">Quà theo mùa</option>
                        <option value="thietke">Đặt thiết kế</option>
                        <option value="khac">Khác (Sản phẩm chung)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Phân loại chi tiết:</label>
                    <select id="p_subCategory" required disabled>
                        <option value="">-- Vui lòng chọn danh mục chính trước --</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Hủy bỏ</button>
                    <button type="submit" class="btn btn-save">Lưu vào hệ thống</button>
                </div>
            </form>
        </div>
    </div>

    <div id="floating-bell">
        🔔<div id="bell-badge" style="display: none;">0</div>
    </div>

    <div id="notification-panel">
        <div class="noti-header">
            <h3>Danh sách chờ xử lý</h3>
        </div>
        <div id="noti-body" class="noti-body">
            <div class="noti-empty">🎉 Tuyệt vời! Không có mục nào đang chờ.</div>
        </div>
    </div>

    <script>
        // ===================================
        // SECURITY & UTILITY FUNCTIONS
        // ===================================

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        function getClientId() {
            let clientId = sessionStorage.getItem('knotty_admin_client_id');
            if (!clientId) {
                clientId = 'admin_' + Math.random().toString(36).substring(2, 15) + '_' + Date.now();
                sessionStorage.setItem('knotty_admin_client_id', clientId);
            }
            return clientId;
        }

        // ===================================
        // CONFIGURATION
        // ===================================

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyOjzwhI7vqo7AQlnJ4l_fIJGHOLwNHAxkUnmithznPu-pvuvQjuhuxM7uDZ58ZIoI9/exec";
        let currentTab = "LienHe";
        let editingRowData = null;

        const tabLabelMap = {
            'LienHe': 'Liên Hệ',
            'DonHang': 'Đơn Hàng',
            'QuaTangNoiBat': 'Quà Tặng Nổi Bật',
            'DanhSachQuaTang': 'Danh Sách Quà Tặng',
            'VoucherThongBao': 'VoucherThongBao',
            'DanhGia': 'Đánh giá'
        };

        const subCategoryMap = {
            'canhan': [
                { id: 'ongba_chame', name: 'Ông bà, Cha mẹ' },
                { id: 'vo_chong_nguoiyeu', name: 'Vợ chồng, Người yêu' },
                { id: 'sinhnhat', name: 'Sinh nhật' },
                { id: 'banbe_dongnghiep', name: 'Bạn bè, Đồng nghiệp' },
                { id: 'cuoi_tangia', name: 'Quà Cưới, Tân gia' },
                { id: 'khac_canhan', name: 'Khác' }
            ],
            'theomua': [
                { id: 'tet', name: 'Tết' },
                { id: 'valentine', name: 'Valentine' },
                { id: 'trungthu', name: 'Trung thu' },
                { id: 'phu_nu', name: 'Nâng niu phái đẹp' },
                { id: 'm19_11', name: 'Ngày của nam giới' },
                { id: 'm20_11', name: 'Tri ân thầy cô' },
                { id: 'giangsinh', name: 'Giáng sinh' },
            ],
            'thietke': [
                { id: 'canhanhoa', name: 'Đặt quà cá nhân hóa' },
                { id: 'soluonglon', name: 'Đặt số lượng lớn' },
                { id: 'khac_thietke', name: 'Khác' }
            ],
            'khac': [
                { id: 'sanphamkhac', name: 'Sản phẩm khác' }
            ]
        };

        // ===================================
        // INITIALIZATION
        // ===================================

        window.onload = function () {
            if (sessionStorage.getItem('knotty_logged_in') === 'true') {
                initAdminSystem();
            } else {
                requestAdminPassword();
            }
        };

        function initAdminSystem() {
            loadData(currentTab);
            checkBackgroundUpdates();
            setInterval(checkBackgroundUpdates, 10000);
        }

        // ===================================
        // AUTHENTICATION
        // ===================================

        function requestAdminPassword() {
            Swal.fire({
                title: 'HỆ THỐNG BẢO MẬT KNOTTY',
                html: `
            <p style="margin-bottom: 15px; color: #4a5568; font-size: 0.95rem;">Nhập mật khẩu quản trị</p>
            <div style="position: relative; max-width: 100%; margin: 0 auto;">
                <input type="password" id="admin-password-input" class="swal2-input" placeholder="Nhập mật khẩu..." style="width: 100%; box-sizing: border-box; padding-right: 50px; margin: 0;">
                <span id="toggle-password-eye" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #a0aec0; display: flex; align-items: center; justify-content: center; z-index: 10;">
                    <svg id="eye-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </span>
            </div>`,
                allowOutsideClick: false,
                allowEscapeKey: false,
                confirmButtonText: 'Đăng nhập',
                confirmButtonColor: '#d4af37',
                showLoaderOnConfirm: true,
                didOpen: () => {
                    const passwordInput = document.getElementById('admin-password-input');
                    const toggleEye = document.getElementById('toggle-password-eye');
                    const eyeIcon = document.getElementById('eye-icon');

                    toggleEye.addEventListener('click', () => {
                        if (passwordInput.type === 'password') {
                            passwordInput.type = 'text';
                            eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"></path>`;
                            toggleEye.style.color = '#d4af37';
                        } else {
                            passwordInput.type = 'password';
                            eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
                            toggleEye.style.color = '#a0aec0';
                        }
                    });

                    passwordInput.addEventListener('keydown', function (e) {
                        if (e.key === 'Enter') Swal.clickConfirm();
                    });
                    passwordInput.focus();
                },
                preConfirm: () => {
                    const password = document.getElementById('admin-password-input').value;
                    if (!password) {
                        Swal.showValidationMessage('Vui lòng nhập mật khẩu đầy đủ!');
                        return false;
                    }
                    return fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'verifyPassword',
                            password: password,
                            clientId: getClientId()
                        })
                    })
                        .then(res => res.json())
                        .catch(err => {
                            Swal.showValidationMessage(`Lỗi kết nối máy chủ: ${err}`);
                        });
                }
            }).then((result) => {
                if (result.value && result.value.result === 'success') {
                    sessionStorage.setItem('knotty_logged_in', 'true');
                    sessionStorage.setItem('knotty_admin_token', result.value.sessionToken);
                    sessionStorage.setItem('knotty_admin_timestamp', result.value.sessionTimestamp);
                    Swal.fire({ title: 'Thành công!', text: 'Chào mừng bạn trở lại.', icon: 'success', timer: 1500, showConfirmButton: false });
                    initAdminSystem();
                } else {
                    let msg = (result.value && result.value.message) ? result.value.message : 'Mật khẩu sai hoặc lỗi kết nối!';
                    Swal.fire({ title: 'Thất bại', text: msg, icon: 'error', confirmButtonText: 'Thử lại', confirmButtonColor: '#d4af37' }).then(() => { requestAdminPassword(); });
                }
            });
        }

        function logoutAdmin() {
            sessionStorage.removeItem('knotty_logged_in');
            sessionStorage.removeItem('knotty_admin_token');
            sessionStorage.removeItem('knotty_admin_timestamp');
            window.location.reload();
        }

        // ===================================
        // TAB NAVIGATION
        // ===================================

        function switchTab(tabName, element) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (element) {
                element.classList.add('active');
            }

            const actionBar = document.getElementById('action-bar');
            if (tabName === 'QuaTangNoiBat' || tabName === 'DanhSachQuaTang') {
                actionBar.style.display = 'block';
                actionBar.innerHTML = `<button class="btn btn-add" onclick="openAddModal()">Thêm sản phẩm mới</button>`;
            } else if (tabName === 'VoucherThongBao') {
                actionBar.style.display = 'block';
                actionBar.innerHTML = `
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end;">
                        <button class="btn btn-add" onclick="openVTModal('Voucher')">+ Thêm Voucher</button>
                        <button class="btn btn-add" style="background:#3498db;" onclick="openVTModal('Thông báo')">+ Thêm Thông báo</button>
                    </div>`;
            } else {
                actionBar.style.display = 'none';
            }
            loadData(tabName);
        }

        // ===================================
        // DATA LOADING & DISPLAY
        // ===================================

        function loadData(tabName) {
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = `<div class="loading-status">Đang tải dữ liệu từ hệ thống...</div>`;

            let actionParam = tabName === 'LienHe' ? "getContacts" :
                tabName === 'DonHang' ? "getOrders" :
                    tabName === 'QuaTangNoiBat' ? "getFeaturedGifts" :
                        tabName === 'DanhSachQuaTang' ? "getProducts" :
                            tabName === 'DanhGia' ? "getReviews" :
                                tabName === 'VoucherThongBao' ? "getVoucherThongBao" : "getProducts";

            // FIXED: Bổ sung Token vào GET Request để chống rò rỉ dữ liệu qua cache/direct access
            const token = sessionStorage.getItem('knotty_admin_token') || '';

            fetch(`${SCRIPT_URL}?action=${actionParam}&clientId=${getClientId()}&token=${token}`).then(res => res.json()).then(data => {

                // Fixed logic in case error occurs
                if (data.result === 'error') {
                    contentArea.innerHTML = `<div class="loading-status" style="color:var(--danger);">${data.error || 'Phiên làm việc không hợp lệ'}</div>`;
                    return;
                }

                if (!data || data.length === 0) {
                    contentArea.innerHTML = `<div class="loading-status">Chưa ghi nhận dòng dữ liệu nào.</div>`;
                    return;
                }

                let html = `<div class="table-container"><table><thead><tr>`;

                if (tabName === 'VoucherThongBao') {
                    renderVoucherThongBao(data, contentArea);
                    return;
                }

                if (tabName === 'LienHe') html += `<th>STT</th><th>Thời gian gửi</th><th>Họ và tên</th><th>Số điện thoại</th><th>Địa chỉ Email</th><th>Trạng thái</th><th>Thao tác</th>`;
                else if (tabName === 'DonHang') html += `<th>STT</th><th>Thời gian</th><th>Mã hóa đơn</th><th>Khách hàng</th><th>Địa chỉ giao nhận</th><th>Chi tiết sản phẩm</th><th>Tổng tiền</th><th>Ghi chú</th><th>Trạng thái</th><th>Thao tác</th>`;
                else if (tabName === 'DanhGia') html += `<th>STT</th><th>Thời gian</th><th>Tên hiển thị</th><th>Số sao</th><th>Nội dung đánh giá</th><th>ID Khách</th><th>Trạng thái</th><th>Thao tác</th>`;
                else html += `<th>STT</th><th>Ảnh minh họa</th><th>Tên sản phẩm</th><th>Giá hiển thị</th><th>Giá số (tính toán)</th><th>Nhãn (Tag)</th><th>Tương tác</th><th>Danh mục chính</th><th>Chi tiết</th><th>Thao tác</th>`;

                html += `</tr></thead><tbody>`;

                const textTranslateType = (val) => val === 'tuvan' ? '<span class="badge badge-phone">Nhận tư vấn</span>' : '<span class="badge badge-cart">Giỏ hàng</span>';

                const textTranslateCat = (val) => {
                    const map = { 'canhan': 'Cá nhân', 'theomua': 'Quà theo mùa', 'thietke': 'Đặt thiết kế', 'khac': 'Khác' };
                    return `<span class="badge badge-cat">${escapeHtml(map[val] || val || 'Chưa phân mục')}</span>`;
                };

                const textTranslateSubCat = (val) => {
                    for (let key in subCategoryMap) {
                        let found = subCategoryMap[key].find(item => item.id === val);
                        if (found) return `<span class="badge badge-tag">${escapeHtml(found.name)}</span>`;
                    }
                    return val ? `<span class="badge badge-tag">${escapeHtml(val)}</span>` : `<span style="color:#cbd5e0">-</span>`;
                };

                if (tabName === 'LienHe' || tabName === 'DonHang') data.reverse();
                window.currentTableData = data;

                data.forEach((row, index) => {
                    let isUnprocessed = false;
                    let trClass = '';

                    if (tabName === 'LienHe' || tabName === 'DonHang') {
                        let statusText = row['Trạng thái'] || 'Chưa xử lý';
                        let isCanceled = (statusText === 'Đã hủy');
                        isUnprocessed = (statusText === 'Chưa xử lý');

                        if (isCanceled) {
                            trClass = 'style="background-color: #fff5f5 !important; border-left: 4px solid #dc3545 !important;"';
                        } else if (isUnprocessed) {
                            trClass = 'class="row-new-highlight"';
                        } else {
                            trClass = '';
                        }
                    }

                    html += `<tr ${trClass}><td><strong>${index + 1}</strong></td>`;

                    if (tabName === 'LienHe') {
                        html += `<td>${formatTime(row['Thời gian'])}</td><td>${escapeHtml(row['Họ và tên'] || '')}</td><td>${escapeHtml(row['Số điện thoại'] || '')}</td><td>${escapeHtml(row['Email'] || '')}</td>`;
                        html += `<td>${isUnprocessed ? '<span class="badge badge-phone">Chưa xử lý</span>' : '<span class="badge badge-tag">Đã xử lý</span>'}</td>`;
                    }
                    else if (tabName === 'DonHang') {
                        let email = row['Email'] || row['Địa chỉ Email'] || row['email'] || '';
                        let shipping = row['Vận chuyển'] || row['Hình thức vận chuyển'] || row['shippingMethod'] || '';

                        html += `<td>${formatTime(row['Thời gian'])}</td>`;
                        html += `<td><span style="font-family: monospace; font-weight: bold; color: #4a5568;">${escapeHtml(row['Mã hóa đơn'] || '')}</span></td>`;
                        html += `<td><strong>${escapeHtml(row['Tên khách hàng'] || '')}</strong><br><small style="color:#718096; display: block; margin-top: 4px;">📞 ${escapeHtml(row['Số điện thoại'] || '')}</small><small style="color:#718096; display: block; margin-top: 2px;">✉️ ${escapeHtml(email)}</small></td>`;
                        html += `<td><div style="font-size:0.9rem; margin-bottom: 6px; line-height:1.4;">${escapeHtml(row['Địa chỉ'] || '')}</div>${shipping ? `<span class="badge badge-tag" style="font-size: 0.75rem; background-color: #fffaf0; color: #dd6b20; border-color: #fbd38d; padding: 2px 6px; border: 1px solid; border-radius: 4px; display: inline-block;">🚀 ${escapeHtml(shipping)}</span>` : ''}</td>`;
                        html += `<td style="max-width:260px; font-size:0.88rem; line-height:1.4;">${escapeHtml(row['Sản phẩm'] || '')}</td>`;
                        html += `<td style="color:#e53e3e; font-weight:700;">${escapeHtml(row['Tổng tiền'] || '')}</td>`;
                        html += `<td><small style="color:#718096">${escapeHtml(row['Ghi chú'] || '')}</small></td>`;
                        let statusBadge = '';
                        if (row['Trạng thái'] === 'Đã hủy') {
                            statusBadge = '<span class="badge badge-phone" style="background:#fdf2f8;color:#be185d;border:1px solid #fbcfe8;">Khách Hủy</span>';
                        } else if (isUnprocessed) {
                            statusBadge = '<span class="badge badge-phone">Chưa xử lý</span>';
                        } else {
                            statusBadge = '<span class="badge badge-tag">Đã xử lý</span>';
                        }
                        html += `<td>${statusBadge}</td>`;
                    }
                    else if (tabName === 'DanhGia') {
                        let starsHtml = '<span style="color:#f1c40f;">' + '★'.repeat(row['Số sao'] || 5) + '</span>';
                        html += `<td>${formatTime(row['Thời gian'])}</td>`;
                        html += `<td><strong>${escapeHtml(row['Tên hiển thị'] || '')}</strong></td>`;
                        html += `<td>${starsHtml}</td>`;
                        html += `<td style="max-width:300px; white-space:normal;">${escapeHtml(row['Nội dung đánh giá'] || '')}</td>`;
                        html += `<td><small style="color:#999">${escapeHtml(row['ID Khách hàng'] || '')}</small></td>`;
                        html += `<td>${row['Trạng thái'] === 'Ẩn' ? '<span class="badge badge-phone">Đang ẩn</span>' : '<span class="badge badge-tag">Hiển thị</span>'}</td>`;
                    }
                    else {
                        html += `<td><img src="${row['img'] || ''}" class="prod-img-preview" onerror="this.src='https://via.placeholder.com/50x40?text=No+Img'" alt="${escapeHtml(row['title'] || '')}"></td>`;
                        html += `<td><strong>${escapeHtml(row['title'] || '')}</strong></td><td>${escapeHtml(row['priceText'] || '')}</td><td>${Number(row['rawPrice'] || 0).toLocaleString('vi-VN')} VNĐ</td>`;
                        html += `<td>${row['tag'] ? '<span class="badge badge-tag">' + escapeHtml(row['tag']) + '</span>' : '<span style="color:#cbd5e0">-</span>'}</td>`;
                        html += `<td>${textTranslateType(row['type'] || 'giohang')}</td>`;

                        let rawSubCat = row['subCategory'] || '';
                        let mainCatVal = rawSubCat.includes('_') ? rawSubCat.split('_')[0] : rawSubCat;
                        let subCatVal = rawSubCat.includes('_') ? rawSubCat.substring(rawSubCat.indexOf('_') + 1) : '';

                        html += `<td>${textTranslateCat(mainCatVal)}</td><td>${textTranslateSubCat(subCatVal)}</td>`;
                    }

                    html += `<td style="min-width: 140px; vertical-align: middle;">`;
                    html += `<div style="display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-start;">`;

                    if (tabName === 'QuaTangNoiBat' || tabName === 'DanhSachQuaTang') {
                        html += `<button class="btn" style="flex: 1; background: #3498db; color: white; border: none; padding: 6px 0; border-radius: 6px; cursor: pointer; font-size: 0.85rem;" onclick="editProduct(${index}, '${tabName}', ${index + 1})">Sửa</button>`;
                        html += `<button class="btn btn-delete" style="flex: 1; padding: 6px 0; border-radius: 6px; font-size: 0.85rem;" onclick="deleteRecord('${tabName}', '${row['ID']}', ${index + 1})">Xóa</button>`;
                    } else {
                        if (isUnprocessed) {
                            html += `<button class="btn btn-add" style="padding: 6px 12px; border-radius: 6px; font-size: 0.85rem;" onclick="markAsProcessed('${tabName}', '${row['ID']}')">✔ Xác nhận</button>`;
                        }
                        html += `<button class="btn btn-delete" style="padding: 6px 12px; border-radius: 6px; font-size: 0.85rem;" onclick="deleteRecord('${tabName}', '${row['ID']}', ${index + 1})">Xóa</button>`;
                    }

                    html += `</div></td></tr>`;
                });

                html += `</tbody></table></div>`;
                contentArea.innerHTML = html;
            }).catch(err => {
                contentArea.innerHTML = `<div class="loading-status" style="color:var(--danger);">Lỗi kết nối máy chủ dữ liệu.</div>`;
            });
        }

        // ===================================
        // DATA OPERATIONS
        // ===================================

        function markAsProcessed(tabName, rowId) {
            Swal.fire({ title: 'Đang đánh dấu xử lý...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'updateStatus',
                    sheetName: tabLabelMap[tabName],
                    rowId: rowId,
                    token: sessionStorage.getItem('knotty_admin_token'),
                    tokenTimestamp: sessionStorage.getItem('knotty_admin_timestamp'),
                    clientId: getClientId()
                })
            }).then(res => res.json()).then(data => {
                if (data.result === 'error') return Swal.fire('Lỗi', data.message, 'error');
                Swal.fire({ title: 'Thành công!', icon: 'success', timer: 1500, showConfirmButton: false });
                loadData(tabName);
                checkBackgroundUpdates();
            }).catch(err => Swal.fire('Lỗi', 'Không thể kết nối với máy chủ.', 'error'));
        }

        function deleteRecord(tabName, rowId, stt) {
            Swal.fire({
                title: 'Xác nhận xóa?',
                text: `Bạn có chắc chắn muốn xóa dữ liệu này?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                confirmButtonText: 'Đồng ý',
                cancelButtonText: 'Hủy'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Đang xóa...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
                    fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'deleteRow',
                            sheetName: tabLabelMap[tabName],
                            rowId: rowId,
                            token: sessionStorage.getItem('knotty_admin_token'),
                            tokenTimestamp: sessionStorage.getItem('knotty_admin_timestamp'),
                            clientId: getClientId()
                        })
                    })
                        .then(res => res.json()).then(data => {
                            if (data.result === 'error') return Swal.fire('Lỗi', data.message, 'error');
                            Swal.fire({ title: 'Đã xóa!', icon: 'success', timer: 1000, showConfirmButton: false });
                            loadData(tabName);
                            checkBackgroundUpdates();
                        }).catch(err => Swal.fire('Lỗi!', 'Không thể thao tác.', 'error'));
                }
            });
        }

        // ===================================
        // PRODUCT MANAGEMENT
        // ===================================

        function updateSubCategories() {
            const mainCat = document.getElementById('p_type').value;
            const subCatSelect = document.getElementById('p_subCategory');
            subCatSelect.innerHTML = '';

            if (!mainCat || !subCategoryMap[mainCat]) {
                subCatSelect.innerHTML = '<option value="">-- Vui lòng chọn danh mục chính trước --</option>';
                subCatSelect.disabled = true;
                return;
            }

            subCatSelect.disabled = false;
            subCatSelect.innerHTML = '<option value="">-- Chọn phân loại chi tiết --</option>';
            subCategoryMap[mainCat].forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub.id;
                opt.textContent = sub.name;
                subCatSelect.appendChild(opt);
            });
        }

        function openAddModal() {
            editingRowData = null;
            document.getElementById('modalTitle').innerText = "Thêm sản phẩm mới vào: " + tabLabelMap[currentTab];
            document.getElementById('productForm').reset();
            updateSubCategories();
            document.getElementById('productModal').style.display = 'flex';
        }

        function editProduct(dataIndex, tabName, stt) {
            const row = window.currentTableData[dataIndex];
            editingRowData = row;
            document.getElementById('modalTitle').innerText = `Sửa Sản Phẩm (STT ${stt})`;
            document.getElementById('p_title').value = row['title'] || '';
            document.getElementById('p_img').value = row['img'] || '';
            document.getElementById('p_priceText').value = row['priceText'] || '';
            document.getElementById('p_rawPrice').value = row['rawPrice'] || 0;
            document.getElementById('p_tag').value = row['tag'] || '';

            let actionValue = row['type'] ? row['type'].toString().trim() : 'giohang';
            document.getElementById('p_buttonAction').value = (actionValue !== 'tuvan') ? 'giohang' : 'tuvan';

            let rawSubCat = row['subCategory'] || '';
            let mainCatVal = rawSubCat.includes('_') ? rawSubCat.split('_')[0] : rawSubCat;
            let subCatVal = rawSubCat.includes('_') ? rawSubCat.substring(rawSubCat.indexOf('_') + 1) : '';

            document.getElementById('p_type').value = mainCatVal;
            updateSubCategories();
            document.getElementById('p_subCategory').value = subCatVal;
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeModal(id = 'productModal') {
            document.getElementById(id).style.display = 'none';
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const submitBtn = event.target.querySelector('button[type="submit"]');
            const oldBtnText = submitBtn.innerText;
            submitBtn.innerText = "Đang đồng bộ...";
            submitBtn.disabled = true;

            const isEditMode = (editingRowData !== null);

            const productData = {
                action: isEditMode ? 'editRow' : 'addProduct',
                sheetName: tabLabelMap[currentTab],
                title: document.getElementById('p_title').value,
                img: document.getElementById('p_img').value,
                priceText: document.getElementById('p_priceText').value,
                rawPrice: document.getElementById('p_rawPrice').value,
                tag: document.getElementById('p_tag').value,
                type: document.getElementById('p_buttonAction').value,
                subCategory: document.getElementById('p_type').value + '_' + document.getElementById('p_subCategory').value,
                token: sessionStorage.getItem('knotty_admin_token'),
                tokenTimestamp: sessionStorage.getItem('knotty_admin_timestamp'),
                clientId: getClientId()
            };

            if (isEditMode) productData.rowId = editingRowData.ID;

            Swal.fire({ title: 'Đang lưu...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

            fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(productData) })
                .then(res => res.json()).then(data => {
                    if (data.result === 'error') return Swal.fire('Lỗi', data.message, 'error');
                    Swal.fire({ title: 'Thành công!', icon: 'success', timer: 1500, showConfirmButton: false });
                    closeModal();
                    loadData(currentTab);
                }).catch(err => Swal.fire('Lỗi kết nối!', 'Không thể gửi dữ liệu lên máy chủ.', 'error'))
                .finally(() => { submitBtn.innerText = oldBtnText; submitBtn.disabled = false; });
        }

        // ===================================
        // VOUCHER & NOTIFICATION MANAGEMENT
        // ===================================

        function updateVoucherCondition() {
            const main = document.getElementById('v_conditionMain').value;
            const subGroup = document.getElementById('v_conditionSubGroup');
            const subSelect = document.getElementById('v_conditionSub');

            if (main === 'all' || main === 'khac') {
                subGroup.style.display = 'none';
                subSelect.innerHTML = '<option value="all">Toàn bộ</option>';
            } else {
                subGroup.style.display = 'block';
                subSelect.innerHTML = '<option value="all">Toàn bộ danh mục này</option>';
                if (subCategoryMap[main]) {
                    subCategoryMap[main].forEach(item => {
                        subSelect.innerHTML += `<option value="${item.id}">${escapeHtml(item.name)}</option>`;
                    });
                }
            }
        }

        function openVTModal(type) {
            editingRowData = null;
            if (type === 'Voucher') {
                document.getElementById('v_modalTitle').innerText = "Thêm Voucher Mới";
                document.getElementById('voucherModal').style.display = 'flex';
                document.getElementById('v_code').value = '';
                document.getElementById('v_name').value = '';
                document.getElementById('v_qty').value = '';
                document.getElementById('v_discountValue').value = '';
                document.getElementById('v_visibility').value = 'Hiện';
                document.getElementById('v_conditionMain').value = 'all';
                updateVoucherCondition();
            } else {
                document.getElementById('n_modalTitle').innerText = "Thêm Thông báo";
                document.getElementById('notiModal').style.display = 'flex';
                document.getElementById('n_content').value = '';
            }
        }

        function editVT(idx, type) {
            editingRowData = window.currentTableData[idx];
            if (type === 'Voucher') {
                document.getElementById('v_modalTitle').innerText = "Sửa Voucher";
                document.getElementById('v_code').value = editingRowData['Mã'];
                document.getElementById('v_name').value = editingRowData['Tên'];
                document.getElementById('v_qty').value = editingRowData['Số lượng'];
                document.getElementById('v_discountType').value = editingRowData['Loại giảm'];
                document.getElementById('v_discountValue').value = editingRowData['Giá trị'];
                document.getElementById('v_visibility').value = editingRowData['Trạng thái hiển thị'] || editingRowData['Trạng thái'] || editingRowData['Hiển thị'] || 'Hiện';

                let condition = editingRowData['Điều kiện'] || 'all|all';
                let parts = condition.split('|');
                document.getElementById('v_conditionMain').value = parts[0];
                updateVoucherCondition();
                document.getElementById('v_conditionSub').value = parts[1] || 'all';

                document.getElementById('voucherModal').style.display = 'flex';
            } else {
                document.getElementById('n_modalTitle').innerText = "Sửa Thông báo";
                document.getElementById('n_content').value = editingRowData['Nội dung'];
                document.getElementById('notiModal').style.display = 'flex';
            }
        }

        function handleVTSubmit(e, type) {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const oldBtnText = submitBtn.innerText;
            submitBtn.innerText = "Đang đồng bộ...";
            submitBtn.disabled = true;

            const action = editingRowData ? 'editVT' : 'addVT';
            let payload = {
                action,
                vtType: type,
                rowId: editingRowData ? editingRowData.ID : null,
                token: sessionStorage.getItem('knotty_admin_token'),
                tokenTimestamp: sessionStorage.getItem('knotty_admin_timestamp'),
                clientId: getClientId()
            };

            if (type === 'Voucher') {
                payload.code = document.getElementById('v_code').value.replace(/\s+/g, '').toUpperCase();
                payload.name = document.getElementById('v_name').value;
                payload.qty = document.getElementById('v_qty').value;
                payload.discountType = document.getElementById('v_discountType').value;
                payload.discountValue = document.getElementById('v_discountValue').value;
                payload.visibility = document.getElementById('v_visibility').value;
                payload.condition = document.getElementById('v_conditionMain').value + '|' + document.getElementById('v_conditionSub').value;
            } else {
                payload.content = document.getElementById('n_content').value;
            }

            Swal.fire({ title: 'Đang lưu...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
                .then(res => res.json()).then(data => {
                    if (data.result === 'error') return Swal.fire('Lỗi', data.message, 'error');
                    document.getElementById(type === 'Voucher' ? 'voucherModal' : 'notiModal').style.display = 'none';
                    Swal.fire({ title: 'Thành công!', icon: 'success', timer: 1500, showConfirmButton: false });
                    loadData(currentTab);
                }).catch(err => Swal.fire('Lỗi kết nối!', 'Không thể gửi dữ liệu lên máy chủ.', 'error'))
                .finally(() => { submitBtn.innerText = oldBtnText; submitBtn.disabled = false; });
        }

        function renderVoucherThongBao(data, contentArea) {
            window.currentTableData = data;
            const vouchers = data.filter(d => d['Phân loại'] === 'Voucher');
            const notis = data.filter(d => d['Phân loại'] === 'Thông báo');

            let html = `<h2 style="font-size: 1.2rem; color: #d4af37; margin-bottom: 10px;">🎁 Quản lý Voucher</h2>`;
            html += `<div class="table-container" style="margin-bottom:30px;"><table><thead><tr><th>STT</th><th>Mã Voucher</th><th>Tên hiển thị</th><th>Số lượng còn</th><th>Loại giảm</th><th>Giá trị giảm</th><th>Đã dùng</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>`;

            if (vouchers.length === 0) html += `<tr><td colspan="9" style="text-align:center;">Chưa có Voucher nào.</td></tr>`;

            vouchers.forEach((v, i) => {
                let dIdx = data.findIndex(x => x['ID'] === v['ID']);
                let usedCount = v['Khách đã dùng'] ? v['Khách đã dùng'].toString().split(',').length : 0;
                let visibilityBadge = (v['Trạng thái hiển thị'] || v['Trạng thái'] || v['Hiển thị'] || '').trim() === 'Ẩn' ?
                    '<span class="badge badge-phone" style="background:#fdf2f8;color:#be185d;border:1px solid #fbcfe8;">Mã Ẩn</span>' :
                    '<span class="badge badge-tag" style="background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;">Công khai</span>';

                html += `<tr><td>${i + 1}</td><td><strong style="color:#d4af37">${escapeHtml(v['Mã'])}</strong></td><td>${escapeHtml(v['Tên'])}</td><td><span class="badge badge-cart">${v['Số lượng']}</span></td><td>${escapeHtml(v['Loại giảm'])}</td><td><strong style="color:red">${v['Giá trị']}</strong></td><td>${usedCount} khách</td><td>${visibilityBadge}</td>
                <td style="min-width: 140px; vertical-align: middle;">
                    <div style="display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-start;">
                        <button class="btn" style="flex: 1; background: #3498db; color: white; border: none; padding: 6px 0; border-radius: 6px; cursor: pointer; font-size: 0.85rem;" onclick="editVT(${dIdx}, 'Voucher')">Sửa</button>
                        <button class="btn btn-delete" style="flex: 1; padding: 6px 0; border-radius: 6px; font-size: 0.85rem;" onclick="deleteRecord('VoucherThongBao', '${v['ID']}', 'Voucher')">Xóa</button>
                    </div>
                </td></tr>`;
            });
            html += `</tbody></table></div>`;

            html += `<h2 style="font-size: 1.2rem; color: #3498db; margin-bottom: 10px;">📢 Quản lý Thông báo</h2>`;
            html += `<div class="table-container"><table><thead><tr><th>STT</th><th>Nội dung thông báo đang chạy</th><th>Thao tác</th></tr></thead><tbody>`;

            if (notis.length === 0) html += `<tr><td colspan="3" style="text-align:center;">Chưa có Thông báo nào.</td></tr>`;

            notis.forEach((n, i) => {
                let dIdx = data.findIndex(x => x['ID'] === n['ID']);
                html += `<tr><td>${i + 1}</td><td>${escapeHtml(n['Nội dung'])}</td>
                <td style="min-width: 140px; vertical-align: middle;">
                    <div style="display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-start;">
                        <button class="btn" style="flex: 1; background: #3498db; color: white; border: none; padding: 6px 0; border-radius: 6px; cursor: pointer; font-size: 0.85rem;" onclick="editVT(${dIdx}, 'Thông báo')">Sửa</button>
                        <button class="btn btn-delete" style="flex: 1; padding: 6px 0; border-radius: 6px; font-size: 0.85rem;" onclick="deleteRecord('VoucherThongBao', '${n['ID']}', 'Thông báo')">Xóa</button>
                    </div>
                </td></tr>`;
            });
            html += `</tbody></table></div>`;
            contentArea.innerHTML = html;
        }

        // ===================================
        // REAL-TIME NOTIFICATION SYSTEM
        // ===================================

        window.knownUnprocessedIds = new Set();
        window.unreadNotifications = [];

        const bellDiv = document.getElementById('floating-bell');
        const panelDiv = document.getElementById('notification-panel');

        bellDiv.onclick = function (e) {
            e.stopPropagation();
            panelDiv.style.display = (panelDiv.style.display === 'flex') ? 'none' : 'flex';
        };

        document.addEventListener('click', function (e) {
            if (panelDiv && panelDiv.style.display === 'flex' && !panelDiv.contains(e.target) && !bellDiv.contains(e.target)) {
                panelDiv.style.display = 'none';
            }
        });

        function renderNotificationPanel() {
            const badge = document.getElementById('bell-badge');
            const body = document.getElementById('noti-body');
            const count = window.unreadNotifications.length;

            if (count > 0) {
                badge.innerText = count;
                badge.style.display = 'flex';
                bellDiv.classList.add('bell-shake-active');

                let html = '';
                window.unreadNotifications.forEach(noti => {
                    html += `
                        <div class="noti-item" onclick="handleNotiClick('${noti.tab}')">
                            <div class="noti-icon">${noti.tab === 'DonHang' ? '🚀' : '📞'}</div>
                            <div class="noti-content">
                                <div class="noti-title">${escapeHtml(noti.title)}</div>
                                <div class="noti-desc">${escapeHtml(noti.desc)}</div>
                                <div class="noti-time">🕒 ${noti.time}</div>
                            </div>
                        </div>`;
                });
                body.innerHTML = html;
            } else {
                badge.style.display = 'none';
                bellDiv.classList.remove('bell-shake-active');
                body.innerHTML = `<div class="noti-empty">🎉 Tuyệt vời! Bạn đã xử lý xong toàn bộ công việc.</div>`;
            }
        }

        window.handleNotiClick = function (tabName) {
            document.getElementById('notification-panel').style.display = 'none';
            switchTab(tabName, null);
        };

        function checkBackgroundUpdates() {
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');

            // FIXED: Bổ sung Token vào GET Request
            const token = sessionStorage.getItem('knotty_admin_token') || '';

            fetch(`${SCRIPT_URL}?action=getDashboardData&clientId=${getClientId()}&token=${token}`)
                .then(r => r.json())
                .then(data => {
                    if (data.result === 'error') {
                        if (dot) dot.classList.add('error');
                        if (txt) txt.innerText = "Phiên làm việc lỗi!";
                        return;
                    }

                    if (dot) dot.classList.remove('error');
                    if (txt) txt.innerText = "Đã đồng bộ với máy chủ";

                    let contacts = data.contacts || [];
                    let orders = data.orders || [];

                    let currentUnprocessed = [];
                    let hasNewContact = false;
                    let hasNewOrder = false;

                    contacts.forEach(c => {
                        if ((c['Trạng thái'] || 'Chưa xử lý') !== 'Đã xử lý') {
                            let id = c['ID'] || c.rowIndex;
                            currentUnprocessed.push({
                                id: id,
                                tab: 'LienHe',
                                title: '📞 Yêu cầu liên hệ mới',
                                desc: `Tên: ${escapeHtml(c['Họ và tên'] || 'Ẩn danh')} - SĐT: ${escapeHtml(c['Số điện thoại'] || 'Trống')}`,
                                time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
                            });

                            if (!window.knownUnprocessedIds.has(id)) {
                                hasNewContact = true;
                                window.knownUnprocessedIds.add(id);
                            }
                        }
                    });

                    orders.forEach(o => {
                        // Chỉ thông báo chuông nếu đơn hàng đang ở trạng thái 'Chưa xử lý' (loại bỏ Đã hủy)
                        if ((o['Trạng thái'] || 'Chưa xử lý') === 'Chưa xử lý') {
                            let id = o['ID'] || o.rowIndex;
                            currentUnprocessed.push({
                                id: id,
                                tab: 'DonHang',
                                title: '🚀 Đơn hàng mới',
                                desc: `Khách: ${escapeHtml(o['Tên khách hàng'] || 'Ẩn danh')} (${escapeHtml(o['Tổng tiền'] || '0 VNĐ')})`,
                                time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
                            });

                            if (!window.knownUnprocessedIds.has(id)) {
                                hasNewOrder = true;
                                window.knownUnprocessedIds.add(id);
                            }
                        }
                    });

                    let currentIdSet = new Set(currentUnprocessed.map(i => i.id));
                    for (let oldId of window.knownUnprocessedIds) {
                        if (!currentIdSet.has(oldId)) {
                            window.knownUnprocessedIds.delete(oldId);
                            if (currentTab === 'LienHe' || currentTab === 'DonHang') loadData(currentTab);
                        }
                    }

                    window.unreadNotifications = currentUnprocessed.reverse();
                    renderNotificationPanel();

                    if (hasNewContact || hasNewOrder) {
                        const audio = new Audio('thongbao.mp3');
                        audio.play().catch(() => { /* Silent fail */ });

                        let notiTitle = '', notiText = '';
                        if (hasNewContact && hasNewOrder) {
                            notiTitle = 'CÓ YÊU CẦU & ĐƠN HÀNG MỚI!';
                            notiText = 'Vừa có khách hàng liên hệ và đặt hàng mới.';
                        }
                        else if (hasNewOrder) {
                            notiTitle = '🚀 CÓ ĐƠN HÀNG MỚI!';
                            notiText = 'Vừa có khách đặt một đơn hàng mới.';
                        }
                        else if (hasNewContact) {
                            notiTitle = '📞 CÓ YÊU CẦU LIÊN HỆ!';
                            notiText = 'Vừa có khách hàng gửi yêu cầu tư vấn.';
                        }

                        Swal.fire({
                            title: notiTitle,
                            text: notiText,
                            icon: 'info',
                            toast: true,
                            position: 'top-end',
                            showConfirmButton: false,
                            timer: 6000,
                            timerProgressBar: true
                        });

                        if (currentTab === 'LienHe' || currentTab === 'DonHang') loadData(currentTab);
                    }
                }).catch(err => {
                    if (dot) dot.classList.add('error');
                    if (txt) txt.innerText = "Mất kết nối dữ liệu!";
                });
        }

        function formatTime(isoString) {
            if (!isoString) return '';
            try {
                const d = new Date(isoString);
                if (isNaN(d.getTime())) return isoString;
                return `${d.getDate().toString().padStart(2, '0')}/${(d.getMonth() + 1).toString().padStart(2, '0')}/${d.getFullYear()} ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
            } catch (e) {
                return isoString;
            }
        }
    </script>
</body>
